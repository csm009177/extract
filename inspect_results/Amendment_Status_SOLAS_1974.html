        $(document).ready(function () {
            $("#ctl00_BodyContentPlaceHolder_hdnScreenWidth").val(screen.availWidth);
            $("#ctl00_BodyContentPlaceHolder_hdnScreenHeight").val(screen.availHeight);

			
            // mesesage 처리
            // session 끊김(다른 사용자가 접속)
            if ($.query.get("kind") == "Expired") {
                jQuery.WebUtils.loc('../Dialogs/DialogExistLoginSession.aspx?kind=Expired',
                                                            jQuery.extend({ win: window,
                                                                w: 800,
                                                                h: 300,
                                                                wintype: 'modal'
                                                            }));
            }

            $("#ctl00_BodyContentPlaceHolder_txtId").focus();
            
			

            $("input[type='text']").keypress(function (event) {
                if (event.keyCode == 13) {
                    if (!krcon.ValidateAPI.isValid()) return false;
                    else
                        eval($("#ctl00_BodyContentPlaceHolder_btnLogin").attr("href"));
                }
            });

            $("input[type='password']").keypress(function (event) {
                if (event.keyCode == 13) {
                    if (!krcon.ValidateAPI.isValid()) return false;
                    else
                        eval($("#ctl00_BodyContentPlaceHolder_btnLogin").attr("href"));
                }
            });

            $("#ctl00_BodyContentPlaceHolder_btnLogin").click(function () {

                if (!krcon.ValidateAPI.isValid()) return false; // valid check

                if (!krcon.Common.Submit.setSubmit(true)) return false;

                krcon.Common.Submit.initSubmit();

                return true;

            });
        });

        function RefreshPage(level) {
            try {
                if (level > 0) {
                    parent.parent.window.frames['bodyFrame'].location = '../Functions/Body.aspx';
                    parent.parent.window.frames['topFrame'].location = '../Index/TopMenu.aspx';
                    parent.parent.window.frames['adminFrame'].location = '../Index/AdminMenu.aspx';
                } else {
                    parent.parent.window.frames['topFrame'].location = '../Index/TopMenu.aspx';

                    var targetUrl = '/Functions/TreeView/View.aspx?LocaleKey=en&Id=4271';
                    if (targetUrl == '') {
                        window.top.location = '/';
                    } else {
                        window.location.href = '/Functions/TreeView/View.aspx?LocaleKey=en&Id=4271';
                    }
                }
            }
            catch(e) {
                window.location.href = '/Functions/TreeView/View.aspx?LocaleKey=en&Id=4271';
            }
